[project]
name = "reels-ripper-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Calvin Vu", email = "vucalvin95@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "beartype>=0.23.1",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
reels-ripper-agent = "reels_ripper_agent:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
